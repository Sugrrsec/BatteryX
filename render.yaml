services:
  - type: web
    name: batteryx
    runtime: python
    plan: free
    buildCommand: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1 && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
